    * {

      padding: 0;
      box-sizing: border-box;

    }

    body {
      background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);

      align-items: center;
      justify-content: center;
      padding: 1.5rem;

      max-width: 1100px;
      padding: 2rem 2rem 2rem 2rem;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: space-between;
      border-bottom: 2px solid rgba(0, 112, 243, 0.15);
      padding-bottom: 1.25rem;
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0b2b4a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .header h1 span {
      background: #0070f3;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 6px rgba(0, 112, 243, 0.3);
    }

    .candidate-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .candidate-selector label {
      font-weight: 500;
      color: #1e3a5f;
      font-size: 1rem;
      background: #e8edf5;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .candidate-selector label i {
      font-style: normal;
      font-size: 1.1rem;
    }

      -webkit-appearance: none;

      border: 1px solid #cfddee;
      border-radius: 60px;
      padding: 0.8rem 3rem 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      color: #0b2b4a;
      cursor: pointer;
      box-shadow: 0 4px 10px -4px rgba(0, 40, 80, 0.15);
      transition: all 0.15s;
      min-width: 260px;
    }

    select:hover {
      border-color: #0070f3;
      box-shadow: 0 6px 14px -6px rgba(0, 112, 243, 0.3);
    }

    select:focus {
      outline: 2px solid #0070f3;
      outline-offset: 2px;
      border-color: transparent;
    }

    .question-panel {
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02), 0 8px 20px -8px rgba(0, 30, 60, 0.15);

      border: 1px solid #e3eaf2;
      transition: all 0.2s;
      min-height: 400px;
      max-height: 600px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #b6c9e0 #f0f4fa;
    }

      width: 8px;
    }

    .question-panel::-webkit-scrollbar-track {
      background: #f0f4fa;
      border-radius: 10px;
    }

    .question-panel::-webkit-scrollbar-thumb {
      background: #b6c9e0;
      border-radius: 10px;
    }

    .question-panel::-webkit-scrollbar-thumb:hover {
      background: #8da9c9;
    }

      gap: 0.5rem;
      background: #e4edfa;
      color: #0055b3;
      font-weight: 600;
      font-size: 1rem;

      border-radius: 60px;
      margin-bottom: 1.5rem;
      border: 1px solid #c5d9f0;

      flex-direction: column;
      gap: 0.75rem;
    }

      background: #f9fcff;

      padding: 1rem 1.5rem 1rem 1.8rem;
      border-radius: 1rem 2rem 2rem 1rem;

      line-height: 1.5;

      border-bottom: 1px solid #e2ebf6;

      border-left-color: #1e5eb0;
      box-shadow: 0 6px 14px -6px rgba(0, 80, 180, 0.25);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #60758e;
      font-size: 1.1rem;
      padding: 4rem 2rem;
      text-align: center;
      gap: 1rem;

      font-size: 3rem;
      opacity: 0.5;
    }

      margin-top: 1rem;

      font-size: 0.8rem;
      color: #7f96b0;

      justify-content: space-between;

      flex-wrap: wrap;

      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      font-weight: 500;
      color: #1e4b7a;

      // --------------------------------------------------------------
      // DOM elements

      const selectEl = document.getElementById('candidateSelect');
      const panelEl = document.getElementById('questionPanel');
      const countEl = document.getElementById('questionCount');

      // --------------------------------------------------------------
      // Helper: update question count badge
      // --------------------------------------------------------------
      function updateCount(count) {
        countEl.textContent = count + ' question' + (count !== 1 ? 's' : '');
      }

      // --------------------------------------------------------------
      // Render questions for selected candidate
      // --------------------------------------------------------------
      function renderCandidate(candidateKey) {
        // Clear panel
        panelEl.innerHTML = '';

        if (!candidateKey || !candidateData[candidateKey]) {
          // Empty state
          panelEl.innerHTML = `
            <div class="empty-state" id="emptyState">
              <span>📋</span>
              <p>Please select a candidate from the dropdown</p>
            </div>
          `;
          updateCount(0);
          return;
        }

        const questions = candidateData[candidateKey];
        const count = questions.length;

        // Candidate badge
        const badge = document.createElement('div');
        badge.className = 'candidate-name-badge';
        badge.innerHTML = `<span>🧑‍💻</span> ${candidateKey}`;

        // Question list container
        const list = document.createElement('ul');
        list.className = 'question-list';

        questions.forEach((q, idx) => {
          const li = document.createElement('li');
          // Add numbering for readability
          li.textContent = `${idx + 1}. ${q}`;
          list.appendChild(li);
        });

        panelEl.appendChild(badge);
        panelEl.appendChild(list);

        updateCount(count);
      }

        placeholder.value = '';
        placeholder.textContent = '-- Select a candidate --';
        placeholder.disabled = false;
        placeholder.selected = true;
        selectEl.appendChild(placeholder);

        // Add candidate options
        keys.forEach(key => {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = key;
          selectEl.appendChild(option);
        });

        // Set default to placeholder (already selected)
        selectEl.value = '';
      }

      // --------------------------------------------------------------
      // Event listener for dropdown change
      // --------------------------------------------------------------
      selectEl.addEventListener('change', (e) => {
        const selected = e.target.value;
        if (selected) {
          renderCandidate(selected);
        } else {
          // Clear panel when placeholder selected (if possible)
          panelEl.innerHTML = `
            <div class="empty-state" id="emptyState">
              <span>📋</span>
              <p>Please select a candidate from the dropdown</p>
            </div>
          `;
          updateCount(0);
        }
      });

      // --------------------------------------------------------------
      // Initialise the UI
      // --------------------------------------------------------------
      function init() {
        populateDropdown();
        // No candidate selected by default -> show empty state
        renderCandidate('');
      }

      init();
    })();
  </script>
</body>
</html>
